<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Tracker &mdash; Thomas Watson</title>
  <meta name="description" content="Private tracker.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Shippori+Mincho&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/note.css">
  <link rel="stylesheet" href="tracker.css">
  <script src="tracker.js" defer></script>
</head>
<body>
  <main class="desk">
    <article class="card card--tracker">
      <span class="staple" aria-hidden="true"></span>

      <header class="masthead">
        <p class="masthead-return"><a href="/">Thomas George Watson</a></p>
        <h1 class="masthead-name">Reverse-Split Tracker</h1>
        <p class="tracker-meta" id="tracker-meta">Loading&hellip;</p>
      </header>

      <hr class="rule">

      <section class="tracker-controls" aria-label="Filters">
        <div class="control-group">
          <span class="control-label">Score</span>
          <label class="check"><input type="checkbox" class="f-score" value="HIGH" checked> High</label>
          <label class="check"><input type="checkbox" class="f-score" value="MED" checked> Med</label>
          <label class="check"><input type="checkbox" class="f-score" value="PREBUY" checked> Prebuy</label>
          <label class="check"><input type="checkbox" class="f-score" value="LOW"> Low</label>
        </div>
        <div class="control-group">
          <label class="control-label" for="f-treatment">Treatment</label>
          <select id="f-treatment">
            <option value="">All</option>
          </select>
        </div>
        <div class="control-group">
          <label class="control-label" for="f-search">Ticker</label>
          <input type="search" id="f-search" placeholder="search&hellip;" autocomplete="off" spellcheck="false">
        </div>
        <div class="control-group">
          <label class="check"><input type="checkbox" id="f-dropped"> Show dropped</label>
        </div>
      </section>

      <div id="tracker-sections"></div>

      <hr class="rule rule--foot">

      <p class="signoff">
        <span class="signoff-en">Thank you.</span>
        <span class="signoff-ja" lang="ja">ありがとうございます。</span>
      </p>
    </article>
  </main>
</body>
</html>
