Pool.prototype.idx=function(o){const a=this.a;for(let i=0;i<this.n;i++)if(a[i]===o)return i;return -1;};
Pool.prototype.clear=function(){this.n=0;};

function updParts(dt){
 for(let i=0;i<PMAX;i++){

 }
}

}

 ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);if(sx!==1||sy!==1)ctx.scale(sx,sy);
 if(a!==undefined&&a<1)ctx.globalAlpha*=a;

}

function hurtAlien(a,dmg,x,y,kb){
 if(a.kind==='hoover'&&!G.boss){
  if(kb){play('ping');addFloat('ping!',x,y-12,14,'#ffffff',.5);a.flash=.05;for(let i=0;i<4;i++)part(PT.white,x,y,vr()*220-110,-vr()*120,.25,.4);}
  return;
 }
 if(a.kind==='moody'&&a.blue){
  /* shooting her while she rests only helps her */
  a.hp=Math.min(a.max,a.hp+dmg);a.flash=.05;play('ping');addFloat('+'+Math.round(dmg),a.x,a.y-a.r,15,'#7cd0ff',.6);return;
 }
 a.hp-=dmg;a.flash=.09;a.zap=.3;play('hit');
 const dx=a.x-x,dy=a.y-y,d=Math.sqrt(dx*dx+dy*dy)||1;
 const kk=kb*(a.kind==='boss'?26:a.kind==='wish'?36:ALIENS[a.kind].floor?20:90)*(1+G.gunL*.08);
 a.kbx+=dx/d*kk;a.kby+=dy/d*kk;kick(a,-3.5);
 if(hasPet('sonar')||a.kind==='boss')addFloat(Math.max(0,Math.ceil(a.hp))+' hp',a.x,a.y-a.r-12,12,'#fff',.45,-40);
 burst(a.kind==='mama'?PT.pink:PT.green,x,y,3,120,.32,.6);
 if(a.hp<=0){
  if(a.kind==='wish'&&a.heads>1){
   /* one head down: the other wakes up */
   a.heads--;a.hp=a.max;a.pointy=!a.pointy;const ox=a.x,oy=a.y;a.x=a.bx;a.y=a.by;a.bx=ox;a.by=oy;
   play('boom',1);shake(10,.4);G.flash=.3;G.flashC='#fff';burst(PT.white,ox,oy,18,260,.5,1);addFloat('ONE MORE!',a.x,a.y-40,24,'#fff36a',1.1);
   return;
  }
  killAlien(a);
 }
}

 let o;
 if(id==='foodq'){const n=FOODS[G.foodQ+1];o=n?{name:n.name,price:FOOD_PRICE}:{name:'Top Food',price:0,maxed:true};}

 else{const S0=SHOP[id];o={name:S0.name,price:S0.price};if(fish.n>=FISH_MAX&&id!=='potion')o.maxed=true;}
 if(G.mode==='sandbox')o.price=0;

 if(G.mode==='challenge'&&id==='egg')o.price=Math.min(99999,Math.round(o.price*(1+.01*Math.floor(Math.max(0,G.t-300)/5))));

function unhideAll(){for(let i=0;i<fish.n;i++)if(fish.a[i].hidden){fish.a[i].hidden=false;kick(fish.a[i],6);}}
function beginClear(){
 stopSiren();setMusic('hush');unhideAll();
 for(let i=aliens.n-1;i>=0;i--){const a=aliens.a[i];burst(PT.purple,a.x,a.y,26,240,.7,1);aliens.kill(i);}
 shots.clear();
 inv.phase=0;inv.spawnQ.length=0;inv.cardT=0;inv.portalT=0;G.dimTarget=0;G.redPulse=0;
 G.flash=.5;G.flashC='#fff';
 const L=curL(),id=L.pet;
 G.alreadyHad=Save.pets.indexOf(id)>=0;G.awarded=id;G.bossPrize=false;
 if(id!=='landlord'){if(!G.alreadyHad)Save.pets.push(id);
 if(Save.crew.length<Save.slots&&Save.crew.indexOf(id)<0)Save.crew.push(id);}
 Save.unlocked=Math.max(Save.unlocked,G.lv+2);if(Save.won&&G.lv>=Save.bonusAt)Save.bonusAt=G.lv+1;
 const k='L'+(G.lv+1),b=Save.best[k];if(!b||G.t<b)Save.best[k]=Math.round(G.t);

 G.clearPhase=1;G.clearT=0;G.hatched=false;G.crackLast=false;
 setState('clear');play('fanfare');

/* ---------- bonus round: falling shells, one per tank (every level once the adventure is beaten) ---------- */
const shellsP=new Pool(30,()=>({}));
let bn={t:0,dur:0,count:3,got:0,last:-1,streak:0,spawn:0};
function startBonus(){
 shellsP.clear();const done=G.lv+1;for(let i=0;i<PCAP;i++)plife[i]=0;pLive=0;
 bn={t:0,dur:10+done,count:3,got:0,last:-1,streak:0,spawn:0,lv:G.lv};
 setMusic('calm');setState('bonus');
}
function updBonus(dt){
 bn.t+=dt;
 if(bn.t<3)return;
 const left=bn.dur-(bn.t-3);
 if(left<=0){finishBonus();return;}
 bn.spawn-=dt;
 if(bn.spawn<=0){bn.spawn=.12+rnd()*.12;const s=shellsP.add();if(s){const r=rnd();s.type=r<.5?0:r<.75?1:r<.9?2:r<.98?3:4;s.x=30+rnd()*(VW-60);s.y=TOP+4;s.vy=70+rnd()*50;s.rot=rnd()*6;s.fly=false;s.t=0;}}
 for(let i=shellsP.n-1;i>=0;i--){const s=shellsP.a[i];
  if(s.fly){s.t+=dt*3;s.x=lerp(s.x,VW/2,s.t);s.y=lerp(s.y,FLOOR+10,s.t);if(s.t>=1)shellsP.kill(i);continue;}
  s.y+=s.vy*dt;s.rot+=dt*2;if(s.y>FLOOR+6)shellsP.kill(i);}
}
function finishBonus(){
 Save.shells+=bn.got;writeSave();G.bonusGot=bn.got;setState('bonusres');play('fanfare');
}
function tapShell(x,y){
 let b=-1,bd=1e12;for(let i=0;i<shellsP.n;i++){const s=shellsP.a[i];if(s.fly)continue;const d=(s.x-x)*(s.x-x)+(s.y-y)*(s.y-y);if(d<34*34&&d<bd){bd=d;b=i;}}
 if(b<0)return;const s=shellsP.a[b];s.fly=true;s.t=0;
 if(s.type===bn.last)bn.streak++;else{bn.last=s.type;bn.streak=1;}
 let v=SHELL_VALS[s.type]*bn.streak;
 if(bn.streak===10)v+=SHELL_VALS[s.type]*25;
 bn.got+=v;play('coin',Math.min(bn.streak,14));burst(PT.gold,s.x,s.y,5,90,.3,.6);
}
function nextBonusBuy(){
 for(let i=0;i<BONUS_PETS.length;i++)if(Save.bonus.indexOf(BONUS_PETS[i].id)<0)return BONUS_PETS[i];
 if(Save.slots<4)return{id:'slot',price:SLOT4_PRICE};
 return null;
}
function buyBonus(){
 const n=nextBonusBuy();if(!n||Save.shells<n.price){play('denied');return;}
 Save.shells-=n.price;play('buy');
 if(n.id==='slot')Save.slots=4;else{Save.bonus.push(n.id);Save.pets.push(n.id);}
 writeSave();buildUI();
}

 Save.wins=(Save.wins||0)+1;G.bossShells=Math.min(5000*Save.wins,50000);Save.shells+=G.bossShells;Save.won=true;Save.bonusAt=0;
 G.alreadyHad=Save.pets.indexOf('mimi')>=0;if(!G.alreadyHad)Save.pets.push('mimi');G.awarded='mimi';G.bossPrize=true;

/* ---------- simulation ---------- */
function spawnCoin(x,y,type,vy,staticT){
 if(coins.n>=coins.size){for(let i=0;i<coins.n;i++)if(!coins.a[i].fly){coins.kill(i);G.stats.missed++;break;}}
 const c=coins.add();if(!c)return null;
 c.x=clamp(x,16,VW-16);c.y=clamp(y,TOP+10,FLOOR-8);c.vy=vy===undefined?-55:vy;c.vx=(vr()-.5)*30;c.type=type;c.val=G.mode==='virtual'?(VT_VAL[type]||1):COINVAL[type];c.rest=staticT||0;c.staticC=!!staticT;c.t=vr()*6;c.sq=.8;c.sqv=0;c.fly=false;c.flyT=0;c.fx=0;c.fy=0;c.spark=.3+vr();c.passed=false;c.bounces=0;
 return c;
}
function nearestAlien(x,y){let b=null,bd=1e12;for(let i=0;i<aliens.n;i++){const a=aliens.a[i];if(a.spawnT>0)continue;const d=(a.x-x)*(a.x-x)+(a.y-y)*(a.y-y);if(d<bd){bd=d;b=a;}}NA.d2=bd;return b;}
const NA={d2:0};
function nearestPrey(f,pred){let b=null,bd=1e12;for(let j=0;j<fish.n;j++){const o=fish.a[j];if(o===f||o.hidden||!pred(o))continue;const d=(o.x-f.x)*(o.x-f.x)+(o.y-f.y)*(o.y-f.y);if(d<bd){bd=d;b=o;}}return b;}
const babyPred=o=>isBaby(o),carnPred=o=>o.kind===K.CARN;
function updFish(dt){
 let alienActive=false;for(let i=0;i<aliens.n;i++)if(aliens.a[i].spawnT<=0&&aliens.a[i].kind!=='mini')alienActive=true;
 const warn=inv.phase===1,lampy=petOf('lampy');
 for(let i=fish.n-1;i>=0;i--){
  const f=fish.a[i];
  if(f.hidden)continue;
  const R=fishR(f),k=f.kind;
  if(G.mode!=='virtual'&&G.mode!=='sandbox')f.full-=(f.kind===K.CATCHER||f.kind===K.CRUNCH?.5:1)*dt;else f.full=Math.max(f.full-dt,9);f.wag+=dt*((f.kind===K.GUPPY||f.kind===K.BREEDER)?15+Math.abs(f.vx)*.08:6+Math.abs(f.vx)*.06);f.bob+=dt*5.4;f.mouth=Math.max(0,f.mouth-dt*4);
  f.blink-=dt;if(f.blink<-.14)f.blink=1.5+rnd()*4;
  f.sqv+=(-160*f.sq-11*f.sqv)*dt;f.sq+=f.sqv*dt;f.shield=Math.max(0,f.shield-dt);f.pinchT=Math.max(0,f.pinchT-dt);
  const wasSick=f.sick;f.sick=f.full<STARVE;
  if(f.sick&&!wasSick){play('hungry');kick(f,3);}
  if(f.full<=0){killFish(i,'starve');continue;}
  const hungry=f.full<HUNGRY;
  let dx=0,dy=0,sp=(f.wSp||36)*spdK,target=false;
  /* fish do not flee from aliens */
  if(alienActive&&lampy&&k===K.GUPPY){const d=Math.hypot(lampy.x-f.x,lampy.y-f.y)||1;dx=(lampy.x-f.x)/d;dy=(lampy.y-f.y)/d;sp=100*spdK;target=true;}
  if(hungry){
   const desperate=f.full<DESPERATE,chase=(f.sick?140:112)*spdK*f.pers*(desperate?1.15:1);
   if(k===K.GUPPY||k===K.BREEDER){
    let bf=null,bd=1e12;for(let j=0;j<food.n;j++){const fd=food.a[j],pot=fd.potion;if(pot&&k!==K.GUPPY)continue;const d=(fd.x-f.x)*(fd.x-f.x)+(fd.y-f.y)*(fd.y-f.y);if(d<bd){bd=d;bf=fd;}}
    if(bf){const d=Math.sqrt(bd)||1;dx=(bf.x-f.x)/d;dy=(bf.y-f.y)/d;sp=chase;target=true;f.lookX=dx;f.lookY=dy;if(d<R*3.2)f.mouth=Math.max(f.mouth,.85);if(d<140)sp*=2.1;
     if(d<R*1.5+8)f.mouth=1;
     if(d<R+10){const died=eat(f,bf);food.kill(food.idx(bf));if(died){killFish(fish.idx(f),'potion');continue;}}}
   }else if(k===K.CARN||k===K.CRUNCH||k===K.MEGA){
    const prey=nearestPrey(f,k===K.MEGA?carnPred:babyPred);
    if(prey){const d=Math.hypot(prey.x-f.x,prey.y-f.y)||1;dx=(prey.x-f.x)/d;dy=(prey.y-f.y)/d;sp=128*spdK;target=true;
     if(d<R*1.5+8)f.mouth=1;
     if(d<R+8+fishR(prey)*.4){f.full=Math.min(FULL_MAX,f.full+(k===K.MEGA?24:k===K.CRUNCH?21:12));kick(f,7);f.mouth=1;play('eaten');
      burst(PT.bone,prey.x,prey.y,3,70,.9,.8);addFloat('Sorry, '+prey.name,prey.x,prey.y-14,12,'#ffe4e4',1.2);
      fish.kill(fish.idx(prey));}}
   }
  }
  /* star and beetle eaters always watch for falling treats */
  if(k===K.CATCHER||k===K.MUNCH){
   const want=k===K.CATCHER?C.STAR:C.BEETLE,chance=k===K.CATCHER?.6:.8;let bc=null,bd=1e12;
   for(let j=0;j<coins.n;j++){const c=coins.a[j];if(c.fly||c.type!==want||c.passed||c.rest>0)continue;const d=(c.x-f.x)*(c.x-f.x)+(c.y-f.y)*(c.y-f.y);if(d<bd){bd=d;bc=c;}}
   if(bc&&(hungry||(k===K.CATCHER&&f.full<24))){const d=Math.sqrt(bd)||1;dx=(bc.x-f.x)/d;dy=(bc.y-f.y-R*.7)/d;sp=110*spdK;target=true;
    if(d<R+12){if(rnd()<chance){kick(f,8);f.mouth=1;play('chomp',4);f.full=Math.min(FULL_MAX,f.full+14);bc.fly=true;bc.flyT=1;bc.val=0;burst(PT.star,bc.x,bc.y,5,80,.3,.6);if(k===K.CATCHER)spawnCoin(f.x,f.y+10,C.DIAMOND,-80);}else{bc.passed=true;}}}
  }
  /* babies dodge whatever hungry thing eats them */
  if(isBaby(f)&&!target){
   for(let j=0;j<fish.n;j++){const o=fish.a[j];if((o.kind!==K.CARN&&o.kind!==K.CRUNCH)||o.full>=HUNGRY)continue;const d2=(o.x-f.x)*(o.x-f.x)+(o.y-f.y)*(o.y-f.y);if(d2<14400){const d=Math.sqrt(d2)||1;dx=(f.x-o.x)/d;dy=(f.y-o.y)/d;sp=92*spdK;target=true;break;}}
  }
  if(!target){
   f.wanderT-=dt;
   if(f.wanderT<=0||((f.tx-f.x)*(f.tx-f.x)+(f.ty-f.y)*(f.ty-f.y)<400)){f.wanderT=1.6+rnd()*3.2;f.tx=40+rnd()*(VW-80);f.ty=TOP+36+rnd()*(FLOOR-TOP-80);const u=rnd();f.wSp=u<.3?14:u<.7?34:62;}
   const d=Math.sqrt((f.tx-f.x)*(f.tx-f.x)+(f.ty-f.y)*(f.ty-f.y))||1;dx=(f.tx-f.x)/d;dy=(f.ty-f.y)/d;
  }
  const steer=Math.min(1,dt*(target?7:2.6));
  f.vx+=(dx*sp-f.vx)*steer;f.vy+=(dy*sp-f.vy)*steer;
  if(f.pinchT>0)f.vy=-180;
  if(k===K.CATCHER||k===K.CRUNCH){
   /* these two live on the sand */
   const fy=FLOOR-R*.7;f.vx=clamp(f.vx,-90*spdK,90*spdK);f.vy=0;f.x+=f.vx*dt;
   if(k===K.CRUNCH&&f.jvy===0&&f.y>=fy-1&&hungry){const pr=nearestPrey(f,babyPred);if(pr&&Math.abs(pr.x-f.x)<70&&pr.y<f.y&&f.y-pr.y<320){f.jvy=-Math.sqrt(2*1100*(f.y-pr.y+10));kick(f,6);}}
   if(f.jvy!==0||f.y<fy){f.jvy+=1100*dt;f.y+=f.jvy*dt;if(f.y>=fy){f.y=fy;f.jvy=0;kick(f,5);}}else f.y=fy;
  }else{f.x+=f.vx*dt;f.y+=f.vy*dt;}
  const mx=R*(k===K.GUPPY||k===K.BREEDER?2.1:1.9),top=TOP+R+6,bot=FLOOR-R*.8;
  if(f.x<mx){f.x=mx;f.vx=Math.abs(f.vx)*.5;f.tx=VW*.6;}if(f.x>VW-mx){f.x=VW-mx;f.vx=-Math.abs(f.vx)*.5;f.tx=VW*.4;}
  if(f.y<top){f.y=top;f.vy=Math.abs(f.vy)*.4;}if(f.y>bot){f.y=bot;f.vy=-Math.abs(f.vy)*.4;}
  if(Math.abs(f.vx)>7){const tf=f.vx>0?1:-1;f.face+=(tf-f.face)*Math.min(1,dt*7);}
  /* what it pays */
  if(!f.sick){
   f.coinT-=dt;
   if(k===K.GUPPY){
    if(f.stage>=1&&f.coinT<=0){f.coinT=f.stage===3?6:5+rnd();dropCoinFrom(f);}
    if(f.stage===2&&!f.star){f.kingT+=dt;if(f.kingT>=KING_TIME)growTo(f,3);}
    if(f.burst>0){f.burstT-=dt;if(f.burstT<=0){f.burst--;f.burstT=.35;if(f.stage>=1)dropCoinFrom(f);}}
   }else if(k===K.BREEDER){
    if(f.stage>=1&&f.coinT<=0){f.coinT=f.stage===1?40:18;const b=spawnFish(K.GUPPY,f.x,f.y+R,0);if(b){kick(b,8);kick(f,8);play('splash');addFloat('Baby!',f.x,f.y-R,12,'#fff',.8);}}
   }else if(k===K.CARN&&f.coinT<=0){f.coinT=6;spawnCoin(f.x,f.y+14,C.DIAMOND,-70);kick(f,5);f.mouth=1;}
   else if(k===K.CRUNCH&&f.coinT<=0){f.coinT=10+rnd();spawnCoin(f.x,f.y+14,C.BEETLE,-70);kick(f,5);}
   else if(k===K.MUNCH&&f.coinT<=0){f.coinT=6+rnd();spawnCoin(f.x,f.y+14,C.PEARL,-70);kick(f,5);}
   else if(k===K.MEGA&&f.coinT<=0){f.coinT=12;spawnCoin(f.x,f.y+24,C.CHEST,-50);kick(f,5);shake(1.5,.1);}
  }
 }
}
function dropCoinFrom(f){
 const R=FR[f.stage],t=f.star?C.STAR:(f.stage===1?C.SILVER:f.stage===2?C.GOLD:C.DIAMOND);
 const c=spawnCoin(f.x+f.face*R*.1,f.y+R*.8,t,30);if(c)c.t=Math.PI/7.2;kick(f,4.2);
}
function growTo(f,st){
 f.stage=st;kick(f,14);play('grow',st);burst(PT.star,f.x,f.y,14,180,.55,1);
 for(let i=0;i<6;i++)part(PT.bubble,f.x+vr()*30-15,f.y+vr()*20,vr()*60-30,-60-vr()*50,.9,.7);
 addFloat(st===3?'All hail King '+f.name+'!':(f.name+' got bigger!'),f.x,f.y-FR[st]-8,13+st,'#fff36a',1.2,-22);
 f.coinT=Math.min(f.coinT,1+rnd()*2);G.hintFlag.grew=true;
}
function eat(f,fd){
 const R=fishR(f);
 if(fd.potion){
  if(f.stage===2&&!f.star&&f.kind===K.GUPPY){f.star=true;kick(f,14);play('grow',3);burst(PT.star,f.x,f.y,18,200,.6,1);addFloat(f.name+' is a star!',f.x,f.y-30,15,'#fff36a',1.2);f.coinT=1;return false;}
  if(f.stage===3||f.star){f.mouth=1;return false;}
  addFloat('Oh, '+f.name+'.',f.x,f.y-22,14,'#ffe4e4',1.2);return true;
 }
 f.full=Math.min(FULL_MAX,f.full+fd.lo+rnd()*(fd.hi-fd.lo));f.gp+=fd.gp;f.mouth=1;kick(f,8);G.feeds++;
 if(G.frenzyT>0)G.frenzy++;else G.frenzy=1;
 G.frenzyT=2.6;
 play('chomp',Math.min(G.frenzy,12));
 burst(PT.sand,fd.x,fd.y,4,70,.3,.5);part(PT.bubble,f.x+f.face*R,f.y,f.face*20,-30,.6,.5);
 if(f.stage<2&&f.gp>=f.need){f.gp=0;f.need=4+rnd()*2;growTo(f,f.stage+1);}
 return false;
}
function killFish(i,why){
 if(i<0||i>=fish.n)return;
 const f=fish.a[i];
 if(why==='starve'){const gh=ghosts.add();if(gh){gh.x=f.x;gh.y=f.y;gh.spr=fishSpr2(f,true);gh.face=f.face;gh.t=0;gh.rot=0;gh.kind=f.kind;gh.stage=f.stage;gh.pal=f.pal;gh.star=f.star;gh.name=f.name;}G.stats.starved++;play('starve');}
 else{burst(PT.bone,f.x,f.y,6,120,1.0,1,60);burst(PT.red,f.x,f.y,8,150,.45,.7);}
 addFloat('RIP '+f.name,f.x,f.y-18,14,why==='starve'?'#dfe6c8':'#ffb9c2',1.7,-24);
 G.stats.lost++;
 fish.kill(i);
}
function updFood(dt){
 const cap=FLOOR-4,sk=slowK();
 for(let i=food.n-1;i>=0;i--){
  const f=food.a[i];
  f.sqv+=(-180*f.sq-10*f.sqv)*dt;f.sq+=f.sqv*dt;f.rot+=dt*1.2;
  if(f.rest>0){f.rest-=dt;if(f.rest<=0){G.stats.wasted++;burst(PT.sand,f.x,f.y,3,30,.3,.4);food.kill(i);}continue;}
  f.vy+=((FLOOR-TOP)/FOOD_SINK*sk-f.vy)*Math.min(1,dt*3);f.y+=f.vy*dt;f.x+=Math.sin(f.y*.03+i)*7*dt;
  if(f.y>=cap){f.y=cap;f.rest=1;f.sq=.5;}
  if(f.potion){/* the potion also hurts a food alien; large guppies come for it even if full */
   for(let j=0;j<fish.n;j++){const o=fish.a[j];if(o.kind!==K.GUPPY||o.hidden)continue;if(o.stage===2&&!o.star){const d=Math.hypot(o.x-f.x,o.y-f.y);if(d<o.stage*12+30){if(eat(o,f)){}food.kill(i);break;}}}
  }
 }
}
function updCoins(dt){
 const cap=FLOOR-6,sk=slowK();
 for(let i=coins.n-1;i>=0;i--){
  const c=coins.a[i];c.t+=dt;
  if(c.fly){
   c.flyT+=dt*3.2;
   const tx=moneyRect?moneyRect.x+moneyRect.w/2:VW-60,ty=moneyRect?moneyRect.y+moneyRect.h*.3:30;
   const e=c.flyT*c.flyT;c.x=lerp(c.fx,tx,e);c.y=lerp(c.fy,ty,e)-Math.sin(c.flyT*Math.PI)*22;
   if(c.flyT>=1)coins.kill(i);
   continue;
  }
  c.sqv+=(-170*c.sq-10*c.sqv)*dt;c.sq+=c.sqv*dt;
  c.spark-=dt;if(c.spark<=0){c.spark=c.val>=100?.25:.6+vr()*.7;part(PT.spark,c.x+vr()*18-9,c.y+vr()*18-9,0,-6,.3,.6);}
  if(c.staticC){c.rest-=dt;if(c.rest<=0)coins.kill(i);continue;}
  if(c.type===C.BOMB&&c.rest<=0){
   /* an uncollected bomb goes off on the fish it reaches */

function updAliens(dt){

  if(a.stun>0){a.vx*=.9;a.vy*=.9;clampAlien(a);continue;}

   /* stays on the floor and shoots */

   const tx=tg?tg.x:VW/2,dd=tx-a.x;a.vx+=(clamp(dd,-1,1)*sp-a.vx)*Math.min(1,dt*2);a.x+=a.vx*dt;if(Math.abs(a.vx)>2)a.face=a.vx>0?1:-1;

   }

  }
  if(a.kind==='boss'){
   const tx=VW*.72+Math.sin(a.t*.4)*VW*.14,ty=TOP+(FLOOR-TOP)*.28;a.vx+=(clamp(tx-a.x,-1,1)*sp-a.vx)*Math.min(1,dt*1.5);a.vy+=(clamp(ty-a.y,-1,1)*sp*.4-a.vy)*Math.min(1,dt*1.5);a.x+=a.vx*dt;a.y+=a.vy*dt;clampAlien(a);continue;

   let bd=1e12,bi=-1;for(let j=0;j<food.n;j++){const f=food.a[j],d=(f.x-a.x)*(f.x-a.x)+(f.y-a.y)*(f.y-a.y);if(d<bd){bd=d;bi=j;}}
   if(bi>=0){const f=food.a[bi];tx=f.x;ty=f.y;have=true;sp*=1.7;
    const dd=Math.sqrt(bd)||1;

/* drawn size: Glorps are drawn 1.75x; on a short tank the alien shrinks toward 50% of the water height */
const ALW={glorp:110,mama:140,mini:52,hoover:120,bomber:110,orbo:104,moody:110,wish:90,boss:160};
/* every alien is capped at about 45% of the water height on every screen; its radius (hit box, bite reach, clamp) scales with it.
   ALH = drawn art height at scale 1 (measured: Glorp 258 units tall at 1.75x). The boss and the two-headed Wishbone keep their size. */
const ALH={glorp:147,mama:184,mini:66,hoover:98,bomber:100,orbo:92,moody:100};
function alienK(kind){const h=ALH[kind];if(!h)return 1;return Math.min(1,.45*(FLOOR-TOP)/(h*((kind==='glorp'||kind==='mama')?1.75:1)));}

function alienHW(a){return (ALW[a.kind]||100)*.5*alienVis(a);}
function clampAlien(a){const m=a.kind==='boss'?a.r*1.15:Math.min(VW/2,Math.max(a.r*.8,alienHW(a)));a.x=clamp(a.x,m,VW-m);a.y=clamp(a.y,a.kind==='boss'?TOP+106:TOP+m*.8,FLOOR-m*.6);}

 }

 const a=alienAt(x,y);

function autoFire(){
 const now=G.t;
 for(let i=0;i<4;i++){const p=PTR[i];if(!p.down||p.y<=TOP)continue;
  const a=alienAt(p.x,p.y);
  if(a&&a.kind!=='hoover'){if(G.gunL>=LASER_MAX&&now-p.lastFire>=.12){p.lastFire=now;shoot(a,p.x,p.y);}continue;}
  /* holding the button keeps feeding */
  if(now-p.lastFire>=.3&&coinAt(p.x,p.y)<0&&!G.boss&&!nearMiss(p.x,p.y)){p.lastFire=now;let n=0;for(let j=0;j<food.n;j++)if(!food.a[j].free&&!food.a[j].potion)n++;if(n<G.foodCap&&G.money>=FOOD_COST)dropFood(p.x,p.y,false);}
 }
}

   rock(g,x,base+2,20*sc,'#6f7f98');rock(g,x+22*sc,base+4,13*sc,'#7d8aa0');}

 }else if(lv===1){
  plant(g,w*.86,base,5,'#39b8a0','#2c9a8a',90);plant(g,w*.42,base,3,'#3cc0a0','#2c9a8a',60);rock(g,w*.12,base,40,C.rock);
  /* a very large conch */
  const x=w*.68,y=base-34;g.strokeStyle=BGINK;g.lineWidth=3;g.beginPath();g.moveTo(x-54,y+30);g.bezierCurveTo(x-40,y-34,x+24,y-46,x+54,y-6);g.bezierCurveTo(x+36,y+6,x+34,y+30,x+10,y+34);g.closePath();const b=g.createLinearGradient(x-50,y-40,x+50,y+30);b.addColorStop(0,'#ffe6d2');b.addColorStop(1,'#e88f9c');g.fillStyle=b;g.fill();g.stroke();
  for(let i=0;i<4;i++){g.beginPath();g.moveTo(x-34+i*20,y+26-i*3);g.quadraticCurveTo(x-20+i*22,y-14,x-4+i*20,y-30+i*4);g.lineWidth=2;g.stroke();}
  /* anchor */

  g.lineWidth=3.5;g.strokeStyle='#8392a3';g.beginPath();g.moveTo(ax,base-64);g.lineTo(ax+8,base-6);g.moveTo(ax-24,base-10);g.quadraticCurveTo(ax+8,base+4,ax+36,base-14);g.moveTo(ax-12,base-48);g.lineTo(ax+14,base-52);g.stroke();

  /* kelp, all of it */
  for(let i=0;i<7;i++){const x=(.06+i*.145)*w,len=h*(.42+((i*41)%30)/100);g.beginPath();g.moveTo(x-5,base);for(let y=0;y<=len;y+=24){g.lineTo(x-5+Math.sin(y*.04+i)*14,base-y);}for(let y=len;y>=0;y-=24){g.lineTo(x+7+Math.sin(y*.04+i)*14,base-y);}g.closePath();g.fillStyle=i%2?'#2e8c4f':'#3aa75c';g.fill();g.strokeStyle=BGINK;g.lineWidth=2.6;g.stroke();

  [-62,50].forEach(o=>{ell(g,x+o+6,y+32,9,6);g.fillStyle='#d4a638';g.fill();g.stroke();});

  ell(g,0,-20,38,28);const d=g.createLinearGradient(0,-48,0,-4);d.addColorStop(0,'#c3fff0');d.addColorStop(1,'#4ec7bc');g.fillStyle=d;g.fill();g.stroke();
  ell(g,0,0,88,22);const m=g.createLinearGradient(0,-22,0,22);m.addColorStop(0,'#d3d9ee');m.addColorStop(1,'#6b7296');g.fillStyle=m;g.fill();g.stroke();

  g.restore();
 }

function frame(ts){
 requestAnimationFrame(frame);
 if(!lastFrame)lastFrame=ts;
 let dt=(ts-lastFrame)/1000;lastFrame=ts;
 if(dt>.25)dt=.25;
 const ms=dt*1000;
 ftHist[ftI]=ms;ftI=(ftI+1)%240;frames++;
 if(ms>ftWorst)ftWorst=ms;
 ftAvg+=(ms-ftAvg)*.05;
 /* governor: a struggling phone sheds particles, not frames */
 if(ftAvg>24){if(++slowFrames>90&&!lowFx){lowFx=true;PMAX=110;for(let i=110;i<PCAP;i++){if(plife[i]>0){plife[i]=0;pLive--;}}pHead=pHead%PMAX;}}else slowFrames=0;
 if(SPEED>1){for(let i=0;i<SPEED;i++)step();}
 else{acc+=dt;let n=0;while(acc>=DT&&n<6){step();acc-=DT;n++;}if(n===6)acc=0;}
 render();
}

   (step and renderSfx exist for the balance harness and the offline level check) */
if(TEST){
 const cx=x=>x*S+cssL,cy=y=>y*S+cssT;
 const rect=b=>({id:b.id,x:cx(b.x+b.w/2),y:cy(b.y+b.h/2),w:b.w*S,h:b.h*S,label:b.label||''});
 window.__ft={
  snap(){
   const L=LEVELS[G.lv];
   const shop={};shopRects.forEach(r=>{if(!r.id)return;const i=shopInfo(r.id);shop[r.id]={x:cx(r.x+r.w/2),y:cy(r.y+r.h/2),w:r.w*S,h:r.h*S,price:i.price,locked:!!i.locked,maxed:!!i.maxed,name:i.name};});
   return{state:G.state,lv:G.lv,level:G.lv+1,tankNo:L.t,levelNo:L.n,boss:G.boss,levelName:L.name,feeds:G.feeds,money:G.money,t:G.t,tick:G.tick,foodQ:G.foodQ,foodCap:G.foodCap,gunL:G.gunL,eggs:G.eggs,clearPhase:G.clearPhase,hatched:!!G.hatched,tip:G.tip,mode:G.mode,shells:Save.shells,bonusOwned:Save.bonus.slice(),slots:Save.slots,fallingShells:shellsP.a.slice(0,shellsP.n).filter(s=>!s.fly).map(s=>({x:cx(s.x),y:cy(s.y),type:s.type})),bonusGot:G.bonusGot||0,won:Save.won,
    invPhase:inv.phase,invT:inv.t,wave:inv.wave,overT:G.overT,
    stats:G.stats?Object.assign({},G.stats):null,chain:G.chain,
    fish:fish.a.slice(0,fish.n).map(f=>({x:cx(f.x),y:cy(f.y),kind:f.kind,stage:f.stage,full:f.full,sick:f.sick,name:f.name,star:f.star,hidden:f.hidden})),
    shots:shots.a.slice(0,shots.n).map(s=>({x:cx(s.x),y:cy(s.y),kind:s.kind,live:s.live})),
    food:food.a.slice(0,food.n).map(f=>({x:cx(f.x),y:cy(f.y),free:f.free,potion:f.potion})),
    coins:coins.a.slice(0,coins.n).filter(c=>!c.fly).map(c=>({x:cx(c.x),y:cy(c.y),val:c.val,type:c.type,rest:c.rest})),
    aliens:aliens.a.slice(0,aliens.n).map(a=>({x:cx(a.x),y:cy(a.y),kind:a.kind,hp:a.hp,max:a.max,r:a.r*S,spawning:a.spawnT>0,fed:a.fed,need:a.need,blue:a.blue,heads:a.heads})),
    pets:pets.map(p=>({id:p.id,x:cx(p.x),y:cy(p.y)})),mapTank:G.mapTank,
    shop,buttons:uiBtns.map(rect),
    tank:{x:cx(0),y:cy(TOP),w:VW*S,h:(FLOOR-TOP)*S},
    mute:rect(Object.assign({id:'mute'},curMute())),pause:pauseRect?rect(Object.assign({id:'pause'},pauseRect)):null,
    scale:S,vw:VW,vh:VH,dpr:DPR,sound:Save.sound,ownedPets:Save.pets.slice(),crew:Save.crew.slice(),unlocked:Save.unlocked,
    audio:AC?AC.state:'none',musMode,
    particles:pLive,particleMax:PMAX,lowFx,frames,ftAvg,ftWorst,ftHist:Array.from(ftHist)};
  },
  renderSfx(name,p,dur){
   const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext;const sr=44100,d=dur||2;const a=new OC(1,sr*d|0,sr);const m=buildBus(a);
   let bus=m;if(name!=='siren'&&!LOUD[name]){bus=a.createGain();bus.gain.value=QUIET_GAIN;bus.connect(m);}
   if(name==='siren')sirenSound(a,m,0,Math.min(d,7.6));else SFX[name](a,bus,0,p);
   return a.startRendering().then(b=>{const c=b.getChannelData(0);let peak=0,sum=0,last=0;for(let i=0;i<c.length;i++){const v=Math.abs(c[i]);if(v>peak)peak=v;sum+=v*v;if(v>.002)last=i;}return{name,peak,rms:Math.sqrt(sum/c.length),audibleSec:last/sr};});
  },
  sfxNames(){return Object.keys(SFX).concat(['siren']);},

  names(){return{title:document.title};},
  /* test-only scene staging for look and motion shots (virtual 640x480 coords) */
  lab:{clear(){fish.n=0;coins.n=0;food.n=0;aliens.n=0;inv.phase=0;inv.t=-9999;},
   fish(kind,stage,x,y,o){const f=spawnFish(kind,x,y,stage);if(f){f.vy=0;Object.assign(f,o||{});}return fish.n-1;},
   set(i,o){Object.assign(fish.a[i],o);},get(i){const f=fish.a[i];return f&&{x:f.x,y:f.y,face:f.face,stage:f.stage,full:f.full,sick:f.sick};},
   food(x,y,q){dropFood(x,y,true,q);},coin(x,y,t){spawnCoin(x,y,t);},kill(i,why){killFish(i,why);},grow(i,st){growTo(fish.a[i],st);},
   alien(kind,x,y,spawn){const D=ALIENS[kind];spawnAlien(kind,D.hp||10,x,y,spawn||0);},hit(x,y){const a=aliens.a[0];if(a)hurtAlien(a,1,x,y,0);ring(x,y);},
   play(){G.state='play';G.overT=0;G.emptyT=EMPTY_LIMIT;buildUI();},tap(x,y){onTap(x,y);},g(o){Object.assign(G,o);},n(){return{fish:fish.n,coins:coins.n,food:food.n,aliens:aliens.n,ghosts:ghosts.n,top:TOP,floor:FLOOR,vw:VW,vh:VH,S};}}
 };
 if(MANUAL){window.__ft.step=function(n){for(let i=0;i<n;i++)step();};window.__ft.render=render;}
 if(TEST&&Q.get('startpets')){/* test-only: choose which pets a level-balance run owns */
  const ps=Q.get('startpets').split(',').filter(p=>PETS[p]);Save.pets=ps;Save.crew=ps.slice(0,3);
 }
 if(TEST&&Q.get('won'))Save.won=true;
 if(TEST&&Q.get('shells'))Save.shells=+Q.get('shells')|0;
 if(TEST&&Q.get('bonus')){Save.bonus=BONUS_PETS.map(b=>b.id);Save.slots=4;Save.pets=Save.pets.concat(Save.bonus);}
 if(TEST&&Q.get('unlock')){Save.unlocked=clamp(+Q.get('unlock')|0,1,21);G.mapTank=clamp(+Q.get('tank')||1,1,4);}
}
buildUI();
if(!MANUAL)requestAnimationFrame(frame);
else render();
})();
</script>
</body>
