<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 900" fill="none">
  <defs>
    <!-- Leaves defined pointing upward (base at origin, tip at negative y) -->
    <g id="ls">
      <path d="M0 0 C6 -8 6 -20 0 -28 C-3 -20 -4 -8 0 0Z"/>
      <path d="M0 0 L0 -28" fill="none"/>
    </g>
    <g id="lm">
      <path d="M0 0 C8 -13 8 -32 0 -45 C-4 -32 -5 -13 0 0Z"/>
      <path d="M0 0 L0 -45" fill="none"/>
    </g>
    <g id="ll">
      <path d="M0 0 C10 -18 10 -44 0 -62 C-6 -44 -7 -18 0 0Z"/>
      <path d="M0 0 L0 -62" fill="none"/>
    </g>
  </defs>

  <g stroke="#2C2C2C" fill="rgba(44,44,44,0.05)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1">

    <!-- ===== STALK 1: main, from (390,0) curving toward lower-left ===== -->
    <path fill="none" stroke-width="2.5"
      d="M 390 0
         C 385 90 378 180 368 280
         C 358 380 344 480 326 590
         C 312 680 297 770 282 870"/>

    <!-- Node rings on Stalk 1 -->
    <path fill="none" stroke-width="3" d="M 381 162 Q 373 170 365 162"/>
    <path fill="none" stroke-width="3" d="M 360 340 Q 352 348 344 340"/>
    <path fill="none" stroke-width="3" d="M 336 518 Q 328 526 320 518"/>

    <!-- Branch 1A: from node ~162, sweeping LEFT -->
    <path fill="none" stroke-width="1.6"
      d="M 381 162 C 348 148 312 138 272 134 C 242 131 212 133 180 140"/>
    <!-- Leaves on Branch 1A (pointing left, slightly up) -->
    <use href="#lm" transform="translate(342,140) rotate(-105)"/>
    <use href="#ll" transform="translate(296,135) rotate(-100)"/>
    <use href="#lm" transform="translate(248,133) rotate(-97)"/>
    <use href="#ls" transform="translate(204,137) rotate(-93)"/>
    <use href="#ls" transform="translate(180,140) rotate(-90)"/>

    <!-- Branch 1B: from node ~340, sweeping RIGHT -->
    <path fill="none" stroke-width="1.6"
      d="M 360 340 C 396 325 434 315 474 312 C 504 309 530 312 554 320"/>
    <!-- Leaves on Branch 1B (pointing right, slightly up) -->
    <use href="#lm" transform="translate(434,315) rotate(72)"/>
    <use href="#ll" transform="translate(474,312) rotate(68)"/>
    <use href="#lm" transform="translate(530,314) rotate(64)"/>

    <!-- Branch 1C: from node ~518, sweeping LEFT -->
    <path fill="none" stroke-width="1.6"
      d="M 336 518 C 302 508 266 502 226 500 C 198 499 172 502 146 510"/>
    <!-- Leaves on Branch 1C -->
    <use href="#lm" transform="translate(266,502) rotate(-96)"/>
    <use href="#ll" transform="translate(226,500) rotate(-92)"/>
    <use href="#lm" transform="translate(172,504) rotate(-88)"/>
    <use href="#ls" transform="translate(146,510) rotate(-85)"/>

    <!-- ===== STALK 2: from (510,0), slightly thinner ===== -->
    <path fill="none" stroke-width="2"
      d="M 510 0
         C 506 70 500 140 492 220
         C 484 300 474 385 460 480"/>

    <!-- Nodes on Stalk 2 -->
    <path fill="none" stroke-width="2.5" d="M 494 138 Q 487 145 480 138"/>
    <path fill="none" stroke-width="2.5" d="M 465 298 Q 458 305 451 298"/>

    <!-- Branch 2A: from node ~138, going LEFT -->
    <path fill="none" stroke-width="1.4"
      d="M 494 138 C 464 125 430 117 392 113 C 366 110 342 112 318 118"/>
    <!-- Leaves -->
    <use href="#ls" transform="translate(430,118) rotate(-106)"/>
    <use href="#lm" transform="translate(392,113) rotate(-102)"/>
    <use href="#lm" transform="translate(350,115) rotate(-98)"/>
    <use href="#ls" transform="translate(318,118) rotate(-94)"/>

    <!-- Branch 2B: from node ~298, going RIGHT -->
    <path fill="none" stroke-width="1.4"
      d="M 465 298 C 496 285 528 278 558 276"/>
    <!-- Leaves -->
    <use href="#lm" transform="translate(528,278) rotate(70)"/>
    <use href="#ls" transform="translate(558,276) rotate(66)"/>

    <!-- ===== STALK 3: thin, enters from right edge at y≈200 ===== -->
    <path fill="none" stroke-width="1.5"
      d="M 560 200
         C 548 255 534 315 518 384
         C 502 453 484 528 462 610"/>

    <!-- Node on Stalk 3 -->
    <path fill="none" stroke-width="2" d="M 520 282 Q 514 288 508 282"/>

    <!-- Branch 3A: from node, going LEFT -->
    <path fill="none" stroke-width="1.2"
      d="M 520 282 C 496 272 468 266 436 264 C 412 262 388 264 366 270"/>
    <!-- Leaves -->
    <use href="#ls" transform="translate(468,266) rotate(-100)"/>
    <use href="#lm" transform="translate(436,264) rotate(-97)"/>
    <use href="#ls" transform="translate(382,268) rotate(-93)"/>

  </g>
</svg>
